name: Web CI

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'web-app/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-single-react.mjs'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web-app/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-single-react.mjs'
      - '.github/workflows/web-ci.yml'

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Check for a single React
        run: node scripts/check-single-react.mjs

      - name: Typecheck web app
        run: npm run typecheck --workspace=web-app

      # A production build also lints and type-checks. The values are
      # placeholders: nothing contacts Supabase during the build.
      - name: Build web app
        run: npm run build --workspace=web-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: '1'
